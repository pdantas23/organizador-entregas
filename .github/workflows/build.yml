name: Build Executables

# Dispara em push para main OU manualmente pelo botão "Run workflow" no GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar apenas dependências necessárias
        run: pip install openpyxl pyinstaller

      - name: Gerar .app (macOS)
        run: |
          python -m PyInstaller \
            --name            OrganizadorEntregas \
            --windowed \
            --onedir \
            --noconfirm \
            --add-data        "utils:utils" \
            --add-data        "models:models" \
            --add-data        "services:services" \
            --add-data        "excel:excel" \
            --add-data        "export:export" \
            --add-data        "ui:ui" \
            --hidden-import   openpyxl \
            --hidden-import   openpyxl.cell \
            --hidden-import   openpyxl.cell._writer \
            --hidden-import   openpyxl.styles \
            --hidden-import   openpyxl.utils \
            --hidden-import   openpyxl.writer.excel \
            --exclude-module  numpy \
            --exclude-module  PIL \
            --exclude-module  lxml \
            --exclude-module  matplotlib \
            --exclude-module  pandas \
            main.py

      - name: Criar DMG instalador
        run: |
          STAGING="/tmp/OrganizadorEntregas-dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -r dist/OrganizadorEntregas.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname  OrganizadorEntregas \
            -srcfolder "$STAGING" \
            -ov \
            -format   UDZO \
            dist/OrganizadorEntregas.dmg
          rm -rf "$STAGING"

      - name: Upload artefato macOS
        uses: actions/upload-artifact@v4
        with:
          name: OrganizadorEntregas-macOS
          path: dist/OrganizadorEntregas.dmg
          retention-days: 30

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar apenas dependências necessárias
        run: pip install openpyxl pyinstaller

      - name: Gerar .exe (Windows)
        run: |
          python -m PyInstaller `
            --name            OrganizadorEntregas `
            --windowed `
            --onefile `
            --noconfirm `
            --add-data        "utils;utils" `
            --add-data        "models;models" `
            --add-data        "services;services" `
            --add-data        "excel;excel" `
            --add-data        "export;export" `
            --add-data        "ui;ui" `
            --hidden-import   openpyxl `
            --hidden-import   openpyxl.cell `
            --hidden-import   openpyxl.cell._writer `
            --hidden-import   openpyxl.styles `
            --hidden-import   openpyxl.utils `
            --hidden-import   openpyxl.writer.excel `
            --exclude-module  numpy `
            --exclude-module  PIL `
            --exclude-module  lxml `
            --exclude-module  matplotlib `
            --exclude-module  pandas `
            main.py

      - name: Upload artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: OrganizadorEntregas-Windows
          path: dist\OrganizadorEntregas.exe
          retention-days: 30
